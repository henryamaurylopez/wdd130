<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>✅ Basic HTML and CSS Quiz</h1>
    </header>
    <main>
        <form class="box">
            <ol>
                <div class="quiz-item">
                    <li><label for="q1">What does the acronym CSS stand for?</label></li>
                    <input type="text" id="q1" name="q1" required>
                </div>

                <div class="quiz-item">
                    <li><label for="q2">How are id and classes attributes selected in
                            CSS?</label></li>
                    <textarea id="q2" name="q2" rows="4" required></textarea>
                </div>

                <div class="quiz-item">
                    <li><label for="q3">Which of the following is a valid CSS comment?</label></li>
                    <select id="q3" name="q3" required>
                        <option value="" selected disabled>Choose one ...</option>
                        <option value="a"># This is a comment</option>
                        <option value="b">/* This is a comment */</option>
                        <option value="c">// This is a comment</option>
                        <option value="d">""" This is a comment """</option>
                    </select>
                </div>

                <div class="quiz-item">
                    <li class="q4"><label for="q4">What is the bottom margin given this
                            declaration?</label>
                    </li>
                    <code>margin: 10px 5px 15px;</code>
                    <input type="number" id="q4" name="q4" required>
                </div>

                <div class="quiz-item">
                    <li><label for="q5">What does the acronym HTML stand for?</label></li>
                    <input type="text" id="q5" name="q5" required>
                </div>
            </ol>

            <button type="submit" class="box">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
