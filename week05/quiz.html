<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>✅ Basic HTML and CSS Quiz</h1>
    </header>
    <main>
        <form class="box">
            <div class="quiz-item">
                <label for="q1">1. What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <div class="quiz-item">
                <label for="q2">2. How are id and classes attributes selected in CSS?</label>
                <textarea id="q2" name="q2" rows="4" required></textarea>
            </div>

            <div class="quiz-item">
                <label for="q3">3. Which of the following is a valid CSS comment?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose one ...</option>
                    <option value="a"># This is a comment</option>
                    <option value="b">/* This is a comment */</option>
                    <option value="c">// This is a comment</option>
                    <option value="d">""" This is a comment """</option>
                </select>
            </div>

            <div class="quiz-item">
                <label for="q4">4. What is the bottom margin given this declaration?</label>
                <code>margin: 10px 5px 15px;</code>
                <input type="number" id="q4" name="q4" required>
            </div>

            <div class="quiz-item">
                <label for="q5">5. What does the acronym HTML stand for?</label>
                <input type="text" id="q5" name="q5" required>
            </div>

            <button type="submit" class="box">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
