<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Form</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>User's Info</legend>

                <div class="form-item column2">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div class="form-item column2">
                    <label for="email">Email Address</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Poll Questions</legend>

                <div class="form-item">
                    <label for="favorite-browser">What is your favorite browser?</label>
                    <select id="browser" name="browser">
                        <option value="chrome">Google Chrome</option>
                        <option value="edge">Edge Explorer</option>
                        <option value="safari">Safari</option>
                        <option value="opera">OperaGX</option>
                        <option value="firefox">Mozilla Firefox</option>
                    </select>
                </div>

                <div class="form-item">
                    <label for="pet">Do you have a household pet? <input type="checkbox" id="pet" \
                          name="pet"></label>
                </div>

                <div class="form-item">
                    <label for="feedback">List the places you have lived:</label>
                    <textarea id="feedback" name="feedback" rows="4" \
                      placeholder="Moca, Haiti, Honduras, Mexico, United States, etc..."></textarea>
                </div>
            </fieldset>

            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>
        <p>©2026 | HTML Form - User's Poll Activity | Henry Amaury Lopez Perez</p>
    </footer>
</body>

</html>
