<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="The contact information of our company in case you want to get in touch with us.">
    <meta name="author" content="Henry Amaury Lopez perez">
    <title>Contact Us - The Dry Oar</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting-logo.png" alt="Rafting Website Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div id="main-contact-grid">
            <div class="company-info">
                <h1>The Dry Oar Company</h1>
                <p>123 Main River Street</p>
                <p>Zarahemla, Bountiful Land</p>
                <p>+1 123 456 7890</p>
                <p>info@dryoar.com</p>
            </div>

            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d30106.85245006946!2d-70.51577662858887!3d19.39699437926345!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sdo!4v1791079028477!5m2!1sen!2sdo"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <form>
                <div class="form-item">
                    <label for="username">Name</label> <input type="text" id="username"
                      name="username" placeholder="Enter your fullname" required>
                </div>

                <div class="form-item">
                    <label for="email">Email</label> <input type="text" id="email" name="email"
                      placeholder="youremail@example.com" required>
                </div>

                <div class="form-item radio-section">
                    <label id="main-radio-label">Message Purpose</label>
                    <input type="radio" id="purpose1" name="purpose"> <label for="purpose1">General
                        Inquiry</label>
                    <input type="radio" id="purpose2" name="purpose"> <label
                      for="purpose2">Reservation
                        Question</label>
                    <input type="radio" id="purpose3" name="purpose"> <label for="purpose3">Website
                        Suggestion</label>
                </div>

                <div class="form-item message">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here"
                      required></textarea>
                </div>

                <div class="form-item checkbox">
                    <input type="checkbox" id="subscription" name="subscription"> <label
                      for="subscription">Please Subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="contacts-grid">
            <h2>We Are Here to Assist You</h2>
            <ul>
                <li>
                    <figure>
                        <img src="images/employee1.jpg" alt="The Shrek's Swamp<">
                        <figcaption>Stephen Duran</figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <img src="images/employee2.jpg" alt="White Inferno">
                        <figcaption>Patricia Wikes</figcaption>
                    </figure>
                </li>
                <li>
                    <figure>
                        <img src="images/employee3.jpg" alt="The Original">
                        <figcaption>Mario Castañeda</figcaption>
                    </figure>
                </li>
            </ul>
        </section>
    </main>
    <footer>
        <p>©2026 | The Dry Oar Company | Henry Amaury Lopez Perez</p>
        <nav class="socialmedia">
            <a href="" target="_blank"><img src="images/facebook-logo.svg" alt="Facebook Logo"></a>
            <a href="" target="_blank"><img src="images/instagram-logo.svg"
                  alt="Instagram Logo"></a>
            <a href="" target="_blank"><img src="images/youtube-logo.svg" alt="YouTube Logo"></a>
        </nav>
    </footer>
</body>

</html>
